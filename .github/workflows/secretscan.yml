name: secretscan

# A backstop for the local git hooks: fails loudly if a commit reaching
# GitHub contains a private key, token or password.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Scan every commit
        run: go run ./scripts/secretscan history
